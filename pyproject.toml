[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketviz"
version = "0.1.0"
description = "Detect ligand-binding pockets and visualise chosen binding sites in an interactive 3D HTML viewer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.22"]

[project.scripts]
pocketviz = "pocketviz.cli:main"

[tool.setuptools]
packages = ["pocketviz"]
